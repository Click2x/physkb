<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Injected input is caught by a hook, swallowed, and re-sent through the Interception driver; real hardware input passes straight through.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker>
  </defs>
  <rect width="1100" height="360" rx="16" fill="#11141c"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#e8ecf8" text-anchor="middle">
    <rect x="30" y="50" width="200" height="90" rx="12" fill="#2a2f45" stroke="#f5c451" stroke-width="2"/>
    <text x="130" y="88" font-size="19" font-weight="600">Software input</text>
    <text x="130" y="114" font-size="14" fill="#a3b0d1">Parsec, macros, SendInput</text>

    <rect x="30" y="220" width="200" height="90" rx="12" fill="#2a2f45" stroke="#4ade80" stroke-width="2"/>
    <text x="130" y="258" font-size="17" font-weight="600">Real keyboard / mouse</text>
    <text x="130" y="284" font-size="14" fill="#a3b0d1">never touched</text>

    <rect x="320" y="50" width="220" height="90" rx="12" fill="#1d2540" stroke="#7aa2ff" stroke-width="2"/>
    <text x="430" y="88" font-size="19" font-weight="600">physkb hooks</text>
    <text x="430" y="114" font-size="14" fill="#a3b0d1">spot the "injected" flag, swallow it</text>

    <rect x="620" y="50" width="200" height="90" rx="12" fill="#1d2540" stroke="#7aa2ff" stroke-width="2"/>
    <text x="720" y="88" font-size="19" font-weight="600">Interception driver</text>
    <text x="720" y="114" font-size="14" fill="#a3b0d1">re-sends via a device slot</text>

    <rect x="880" y="130" width="190" height="100" rx="12" fill="#143222" stroke="#4ade80" stroke-width="2"/>
    <text x="975" y="172" font-size="19" font-weight="600">Windows apps</text>
    <text x="975" y="198" font-size="14" fill="#a3b0d1">see physical input</text>
  </g>
  <g fill="none" stroke-width="3">
    <path d="M230 95H316" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M540 95H616" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M820 95H850Q880 95 880 125" stroke="#7aa2ff" marker-end="url(#a)"/>
    <path d="M230 265H850Q880 265 880 235" stroke="#4ade80" marker-end="url(#g)"/>
  </g>
</svg>
